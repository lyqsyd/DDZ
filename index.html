<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢乐斗地主 · 局域网版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部标题 -->
    <header id="topbar">
      <div class="title">🎴 欢乐斗地主 · 局域网版</div>
      <div id="myName" class="myname"></div>
    </header>

    <!-- 大厅 -->
    <section id="lobby" class="panel">
      <div class="lobby-grid">
        <div class="card-box">
          <h2>进入游戏</h2>
          <label>昵称：</label>
          <input id="nameInput" type="text" maxlength="12" placeholder="输入昵称">
          <div class="btn-row">
            <button id="btnCreate" class="btn primary">创建房间</button>
            <button id="btnJoin" class="btn">加入房间</button>
          </div>
          <label>房间号：</label>
          <input id="joinInput" type="text" maxlength="5" placeholder="如 A1B2C">
        </div>
        <div class="card-box">
          <h2>房间列表</h2>
          <ul id="roomList" class="room-list"></ul>
        </div>
      </div>
    </section>

    <!-- 等待房间 -->
    <section id="waitingPanel" class="panel hidden">
      <div class="waiting-panel">
        <h2>等待玩家加入</h2>
        <div class="waiting-code">房间号：<b id="waitingCode"></b></div>
        <div id="waitingSeats" class="waiting-seats"></div>
        <div class="btn-row">
          <button id="btnAddAI" class="btn">添加 AI</button>
          <button id="btnStart" class="btn primary">开始游戏</button>
        </div>
      </div>
    </section>

    <!-- 游戏房间 -->
    <section id="game" class="hidden">
      <div class="game-top">
        <span id="roomCode" class="room-code"></span>
        <span id="gameState" class="game-state"></span>
        <div class="spacer"></div>
        <button id="btnLeave" class="btn small">离开</button>
      </div>

      <div class="game-body">
        <!-- 左侧边栏：上家 -->
        <aside class="side side-left">
          <div class="player-row" id="pl-left">
            <div class="avatar" id="av-left">🐷</div>
            <div class="pinfo">
              <div class="ptag">上家</div>
              <div class="pname" id="name-left">—</div>
              <div class="role-tag" id="role-left"></div>
            </div>
            <span class="count-badge" id="count-left"></span>
          </div>
        </aside>

        <!-- 中央桌面 -->
        <div class="table-center">
          <div class="deck-area hidden" id="deckArea">
            <div class="deck-label">底 牌</div>
            <div class="deck-cards" id="deckCards"></div>
          </div>
          <div class="played-grid">
            <div class="played-slot">
              <div class="seat-played" id="played-left"></div>
            </div>
            <div class="played-slot">
              <div class="seat-played" id="played-top"></div>
            </div>
          </div>
          <div class="self-played" id="played-self"></div>
        </div>

        <!-- 右侧边栏：下家 -->
        <aside class="side side-right">
          <div class="player-row" id="pl-top">
            <div class="avatar" id="av-top">🐮</div>
            <div class="pinfo">
              <div class="ptag">下家</div>
              <div class="pname" id="name-top">—</div>
              <div class="role-tag" id="role-top"></div>
            </div>
            <span class="count-badge" id="count-top"></span>
          </div>
        </aside>
      </div>

      <!-- 底部：我的头像（左）+ 操作区（水平居中）：出牌 / 不出 / 提示 -->
      <div class="bottom-zone">
        <div class="player-row me" id="pl-self">
          <div class="avatar" id="av-self">🐰</div>
          <div class="pinfo">
            <div class="ptag">我</div>
            <div class="pname" id="name-self">—</div>
            <div class="role-tag self-tag" id="role-self"></div>
          </div>
          <span class="count-badge" id="count-self"></span>
        </div>
        <div class="action-zone">
          <div class="bid-area hidden" id="bidArea">
            <div class="bid-btns" id="bidBtns"></div>
          </div>
          <div class="action-bar hidden" id="actionBar">
            <button id="btnPlay" class="btn primary">出牌</button>
            <button id="btnPass" class="btn">不出</button>
            <button id="btnHint" class="btn">提示</button>
          </div>
          <div class="bid-info hidden" id="bidInfo"></div>
        </div>
        <div class="bz-spacer"></div>
      </div>

      <!-- 我的手牌 -->
      <div class="my-cards" id="myHand"></div>

      <!-- 积分面板：固定游戏区右下角 -->
      <div class="score-block">
        <div class="score-list" id="scoreList"></div>
        <div class="score-meta" id="scoreMeta">暂无对局</div>
      </div>

      <!-- 特效层 -->
      <div id="effectLayer"></div>
    </section>

    <!-- 结算弹窗：大标题(胜利/败北) + 小标题 + 地主/农民小卡片 -->
    <div id="overlay" class="overlay hidden">
      <div class="dialog over-dialog">
        <div class="over-title win" id="overTitle">胜利</div>
        <div class="over-sub win" id="overSub">我不解释</div>
        <div class="over-cards" id="overBody"></div>
        <div class="btn-row">
          <button id="btnRestart" class="btn primary">再来一局</button>
          <button id="btnQuitRoom" class="btn">退出房间</button>
        </div>
      </div>
    </div>

    <!-- 玩家信息弹窗（点击头像查看） -->
    <div id="infoOverlay" class="overlay hidden">
      <div class="dialog info-dialog">
        <h2>玩家信息</h2>
        <div id="infoBody" class="info-body"></div>
        <button id="btnInfoClose" class="btn">关闭</button>
      </div>
    </div>

    <!-- 提示 -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="client.js"></script>
</body>
</html>
